<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus - Login</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">      


    <style>

        /* ================= FULL COLLEGE PHOTO BACKGROUND ================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body.login-page {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 15px;

            /* College photo background */

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.38),
                    rgba(0, 0, 0, 0.38)
                ),
                url("{{ url_for('static', filename='images/college.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }


        /* ================= LOGIN CARD ================= */

        .login-card {

            width: 100%;
            max-width: 540px;

            border: none;
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.96);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.35);

        }


        /* ================= LOGO ================= */

        .logo {

            font-size: 58px;
            line-height: 1;

            margin-bottom: 12px;

        }


        /* ================= TITLE ================= */

        .main-title {

            color: #202124;
            font-weight: 700;

        }


        .sub-title {

            color: #5f6368;
            font-size: 16px;

        }


        /* ================= INPUTS ================= */

        .form-control {

            border-radius: 12px;
            border: 1px solid #d1d5db;

        }


        .form-control:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 0.2rem rgba(79, 70, 229, 0.15);

        }


        /* ================= PASSWORD ================= */

        .password-container {

            position: relative;

        }


        .password-container input {

            padding-right: 50px;

        }


        #togglePassword {

            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;
            user-select: none;

            font-size: 21px;
            z-index: 5;

        }


        /* ================= LOGIN BUTTON ================= */

        .login-btn {

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            border: none;
            border-radius: 12px;

            font-weight: 600;

            transition: 0.3s;

        }


        .login-btn:hover {

            background: linear-gradient(
                135deg,
                #1d4ed8,
                #4338ca
            );

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(37, 99, 235, 0.30);

        }


        /* ================= MOBILE RESPONSIVE ================= */

        @media (max-width: 576px) {

            body.login-page {

                padding: 15px 10px;

                background-position: center;

            }


            .login-card {

                max-width: 100%;
                border-radius: 22px;

            }


            .logo {

                font-size: 45px;

            }


            .main-title {

                font-size: 25px;

            }


            .sub-title {

                font-size: 14px;

            }


            .login-card {

                padding: 25px !important;

            }

        }


        @media (max-width: 400px) {

            .login-card {

                padding: 20px !important;

            }


            .main-title {

                font-size: 23px;

            }


            .sub-title {

                font-size: 13px;

            }

        }

    </style>

</head>


<body class="login-page">


    <!-- ================= LOGIN CARD ================= -->

    <div class="card login-card p-4 p-md-5">


        <!-- ================= HEADER ================= -->

        <div class="text-center mb-4">

            <div class="logo">
                🎓
            </div>


            <h2 class="main-title mb-2">
                Smart Campus
            </h2>


            <p class="sub-title mb-0">
                AI-Based Smart Campus Governance System
            </p>

        </div>


        <!-- ================= ERROR MESSAGE ================= -->

        {% if error %}

        <div class="alert alert-danger text-center">

            {{ error }}

        </div>

        {% endif %}


        <!-- ================= LOGIN FORM ================= -->

        <form method="POST"
              action="/student-login">


            <!-- Name -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    👤 Name
                </label>


                <input
                    type="text"
                    name="name"
                    class="form-control form-control-lg"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- Email -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    📧 Email
                </label>


                <input
                    type="email"
                    name="email"
                    class="form-control form-control-lg"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    🔑 Password
                </label>


                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Enter your password"
                        required>


                    <span
                        id="togglePassword"
                        title="Show or hide password">

                        👁️

                    </span>

                </div>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="btn login-btn text-white btn-lg w-100">

                🚀 Login

            </button>


        </form>


        <!-- ================= INFO ================= -->

        <div class="text-center mt-3">

            <small class="text-muted">

                Login with your personal name, email and password.

            </small>

        </div>


    </div>


    <!-- ================= PASSWORD TOGGLE ================= -->

    <script>

        const togglePassword =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");


        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                password.type = "password";
                togglePassword.textContent = "👁️";

            }

        });

    </script>


</body>

</html>
