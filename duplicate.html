<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Similar Complaint</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Common CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.45)
                ),
                url("{{ url_for('static', filename='images/college.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
        }

        .card {
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.96);
        }

        .icon {
            font-size: 65px;
        }

        .btn {
            border-radius: 10px;
        }

    </style>

</head>


<body>

    <!-- ================= MAIN CONTAINER ================= -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow p-5 text-center">

                    <!-- ================= ICON ================= -->

                    <div class="icon">
                        🔄
                    </div>


                    <!-- ================= TITLE ================= -->

                    <h2>
                        Similar Complaint Found
                    </h2>


                    <!-- ================= DESCRIPTION ================= -->

                    <p class="text-muted mt-3">

                        A similar complaint already exists in the system.

                    </p>


                    <!-- ================= INFORMATION ================= -->

                    <div class="alert alert-warning">

                        💡 This helps the administration avoid handling
                        the same issue multiple times.

                    </div>


                    <!-- ================= BUTTONS ================= -->

                    <div class="mt-3">

                        <a href="/status"
                           class="btn btn-primary me-2">

                            🔍 View Complaints

                        </a>


                        <a href="/student"
                           class="btn btn-outline-dark">

                            🏠 Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
