<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Campus</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Common CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.35)
                ),
                url("{{ url_for('static', filename='images/college.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: none;
            border-radius: 25px;
            background: white;
        }

        .logo {
            font-size: 55px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        #togglePassword {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            font-size: 22px;
        }

        .admin-title {
            color: #4f46e5;
        }

        .login-btn {
            background: #4f46e5;
            border: none;
        }

        .login-btn:hover {
            background: #4338ca;
        }

    </style>

</head>

<body>

    <div class="card login-card shadow-lg p-4">

        <!-- ================= LOGO ================= -->

        <div class="text-center">

            <div class="logo">
                👨‍💼
            </div>

            <h2 class="fw-bold admin-title">
                Admin Login
            </h2>

            <p class="text-muted">
                Smart Campus Governance System
            </p>

        </div>

        <!-- ================= ERROR ================= -->

        {% if error %}

        <div class="alert alert-danger text-center">
            {{ error }}
        </div>

        {% endif %}

        <!-- ================= LOGIN FORM ================= -->

        <form method="POST"
              action="/admin-login">

            <!-- Admin Username -->

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    👤 Admin Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control form-control-lg"
                    placeholder="Enter admin username"
                    required>

            </div>

            <!-- Password -->

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    🔑 Password
                </label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control form-control-lg"
                        placeholder="Enter admin password"
                        required>

                    <span id="togglePassword">
                        👁️
                    </span>

                </div>

            </div>

            <!-- Login Button -->

            <button
                type="submit"
                class="btn login-btn text-white btn-lg w-100">

                🔐 Admin Login

            </button>

        </form>

    </div>

    <!-- ================= PASSWORD TOGGLE ================= -->

    <script>

        const togglePassword =
            document.getElementById("togglePassword");

        const password =
            document.getElementById("password");

        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";
                togglePassword.textContent = "🙈";

            } else {

                password.type = "password";
                togglePassword.textContent = "👁️";

            }

        });

    </script>

</body>

</html>
