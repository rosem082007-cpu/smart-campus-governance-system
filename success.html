<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complaint Submitted</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #d1fae5, #dbeafe);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .success-wrapper {
            min-height: calc(100vh - 40px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card {
            width: 100%;
            max-width: 600px;
            border: none;
            border-radius: 24px;
            background: white;
            padding: 40px;
        }

        .success-icon {
            font-size: 70px;
            line-height: 1;
            margin-bottom: 15px;
        }

        .success-title {
            font-size: 30px;
            font-weight: 700;
        }

        .success-text {
            font-size: 16px;
        }

        .info-box {
            border-radius: 15px;
            background: #f8fafc;
            padding: 25px;
            margin-top: 25px;
        }

        .info-box p {
            margin-bottom: 15px;
            font-size: 16px;
        }

        .info-box p:last-child {
            margin-bottom: 0;
        }

        .action-buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 📱 MOBILE */

        @media (max-width: 576px) {

            body {
                padding: 15px;
            }

            .success-wrapper {
                min-height: calc(100vh - 30px);
            }

            .success-card {
                padding: 25px 18px;
                border-radius: 20px;
            }

            .success-icon {
                font-size: 60px;
            }

            .success-title {
                font-size: 24px;
            }

            .success-text {
                font-size: 14px;
            }

            .info-box {
                padding: 20px;
                margin-top: 20px;
            }

            .info-box p {
                font-size: 15px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .action-buttons a {
                width: 100%;
                margin: 0 !important;
            }

        }

    </style>

</head>


<body>

<div class="success-wrapper">

    <div class="success-card shadow text-center">

        <div class="success-icon">
            ✅
        </div>


        <h2 class="success-title">
            Complaint Submitted Successfully!
        </h2>


        <p class="text-muted success-text">
            Your complaint has been recorded in the system.
        </p>


        <div class="info-box text-start">

            <p>

                <strong>🆔 Complaint ID:</strong>

                <span class="badge bg-primary">
                    #{{ complaint_id }}
                </span>

            </p>


            <p>

                <strong>🏷️ Category:</strong>

                {{ category }}

            </p>


            <p>

                <strong>🚨 Priority:</strong>

                {{ priority }}

            </p>


            <p>

                <strong>⏳ Status:</strong>

                <span class="badge bg-warning text-dark">
                    Pending
                </span>

            </p>

        </div>


        <div class="action-buttons">

            <a href="/status"
               class="btn btn-success">

                🔍 Track Complaint

            </a>


            <a href="/student"
               class="btn btn-outline-primary">

                🏠 Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
