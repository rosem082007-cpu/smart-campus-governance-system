<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Campus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .role-card {
            width: 100%;
            max-width: 450px;
            border: none;
            border-radius: 25px;
        }

        .logo {
            font-size: 65px;
        }

        .role-btn {
            border-radius: 15px;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="card role-card shadow-lg p-4">

    <div class="text-center">

        <div class="logo">
            🏫
        </div>

        <h2 class="fw-bold">
            Smart Campus
        </h2>

        <p class="text-muted">
            AI-Based Smart Campus Governance System
        </p>

        <h5 class="mt-4 mb-3">
            Who are you?
        </h5>

    </div>


    <!-- Student -->

    <a href="/student-login"
       class="btn btn-primary role-btn w-100 mb-3">

        👨‍🎓 Student Login

    </a>


    <!-- Admin -->

    <a href="/admin-login"
       class="btn btn-dark role-btn w-100">

        🔐 Admin Login

    </a>


</div>

</body>

</html>
