<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Settings</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<style>

body {
    background: linear-gradient(135deg, #eef2ff, #dbeafe);
    min-height: 100vh;
}

.navbar {
    border-radius: 0 0 18px 18px;
}

.settings-card {
    border: none;
    border-radius: 22px;
}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark px-4">

<span class="navbar-brand">
🏫 Smart Campus
</span>

<a href="/student"
class="btn btn-outline-light btn-sm">

⬅️ Back

</a>

</nav>


<div class="container mt-5">


<div class="row justify-content-center">

<div class="col-md-7">


<div class="card settings-card shadow p-5">


<div class="text-center mb-4">

<div style="font-size:60px;">
⚙️
</div>

<h2>
Settings
</h2>

<p class="text-muted">
Manage your account details
</p>

</div>


<form method="POST">


<!-- NAME -->

<div class="mb-3">

<label class="form-label">
👤 Name
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ user.name }}"
required>

</div>


<!-- USERNAME -->

<div class="mb-4">

<label class="form-label">
🔑 Username
</label>

<input
type="text"
name="username"
class="form-control"
value="{{ user.username }}"
required>

</div>


<button
type="submit"
class="btn btn-primary w-100">

💾 Save Changes

</button>


</form>


<div class="text-center mt-4">

<a href="/student"
class="btn btn-outline-secondary">

⬅️ Back to Dashboard

</a>

</div>


</div>

</div>

</div>

</div>


</body>

</html>
